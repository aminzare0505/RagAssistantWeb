<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="دستیار اسناد — پاسخ‌های مستند از اسناد سازمانی شما" />
    <title>دستیار اسناد</title>
    <script>
      // Applies persisted theme and language before first paint to avoid a flash.
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = theme === 'dark' || ((theme === 'system' || !theme) && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);

          if (localStorage.getItem('language') === 'en') {
            document.documentElement.lang = 'en';
            document.documentElement.dir = 'ltr';
          }
        } catch (error) {
          // Storage or matchMedia can be unavailable; the React providers recover.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
